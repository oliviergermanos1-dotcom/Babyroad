<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabyRoad — Dispatcher</title>
  <link rel="icon" href="assets/logo-babyroad.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/alerts.css">
</head>
<body>
  <!-- Splash de chargement -->
  <div id="splash">
    <img src="assets/logo-babyroad.svg" alt="">
    <h1><span class="brand-baby">Baby</span><span class="brand-road">Road</span></h1>
    <div class="splash-spinner"></div>
    <p>Connexion à la flotte…</p>
  </div>

  <header class="topbar">
    <div class="brand">
      <button id="btn-panel" class="btn-panel" title="Afficher / masquer le panneau">☰</button>
      <img src="assets/logo-babyroad.svg" alt="BabyRoad" class="brand-logo">
      <h1><span class="brand-baby">Baby</span><span class="brand-road">Road</span></h1>
      <span class="brand-sub">Fleet Tracking — Grand Abidjan</span>
    </div>
    <div class="topbar-right">
      <span id="ping-status" class="ping-badge" title="Ping Supabase">— ms</span>
      <span id="clock" class="clock mono"></span>
    </div>
  </header>

  <main class="layout">
    <!-- Panel latéral -->
    <aside class="panel" id="panel">
      <button id="btn-panel-close" class="btn-panel-close" title="Fermer">✕ Fermer — voir la carte</button>

      <div class="panel-section">
        <div class="section-head">
          <h2>🚛 Flotte (<span id="fleet-count">0</span>)</h2>
          <button id="btn-add-driver" class="btn-icon" title="Ajouter un chauffeur">➕</button>
        </div>
        <div id="fleet-chips" class="fleet-chips"></div>
        <div id="driver-cards"></div>
      </div>

      <div class="panel-section">
        <h2>🌦 Météo Abidjan 72h</h2>
        <div id="weather-panel" class="weather-panel">Chargement…</div>
      </div>

      <div class="panel-section">
        <h2>🔔 Alertes</h2>
        <div id="alerts-list" class="alerts-list">
          <p class="muted">Aucune alerte</p>
        </div>
      </div>

      <div class="panel-section">
        <h2>📊 Historique</h2>
        <div class="history-controls">
          <select id="history-driver"></select>
          <input type="date" id="history-date">
          <button id="btn-history" class="btn btn-secondary">Afficher</button>
          <button id="btn-export-csv" class="btn btn-secondary">⬇ Export CSV</button>
        </div>
        <div id="history-stats" class="history-stats"></div>
      </div>
    </aside>

    <!-- Carte -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Contrôle de couches -->
      <div class="layers-control" id="layers-control">
        <button id="btn-layers" class="layers-head" title="Couches de la carte">
          🗺 Couches <span class="layers-caret">▾</span>
        </button>
        <div class="layers-body" id="layers-body">
          <label class="layer-pill"><input type="checkbox" id="toggle-traffic"><span>🚦 Trafic</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-satellite"><span>🛰 Satellite</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-weather"><span>🌧 Pluie</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-buildings" checked><span>🏙 3D bât.</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-geofences" checked><span>📍 Zones</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-trajectories" checked><span>〰 Traces</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-landmarks" checked><span>🏛 Monuments</span></label>
          <label class="layer-pill"><input type="checkbox" id="toggle-cameras" checked><span>📡 Radars</span></label>
          <div class="layers-actions">
            <button id="btn-style" class="btn-map" title="Fond clair / sombre">🌓 Fond</button>
            <button id="btn-23d" class="btn-map" title="Bascule 2D / 3D">2D</button>
            <button id="btn-measure" class="btn-map" title="Mesurer une distance">📏</button>
          </div>
        </div>
      </div>

      <div id="measure-result" class="measure-result hidden"></div>
      <div id="follow-banner" class="follow-banner hidden">
        📍 Suivi : <span id="follow-name"></span>
        <button id="btn-unfollow">✕</button>
      </div>
    </div>
  </main>

  <!-- Modal ajout chauffeur -->
  <div id="driver-modal" class="modal hidden">
    <form id="driver-form" class="modal-card">
      <h3>➕ Nouveau chauffeur</h3>
      <label>Nom complet *
        <input name="full_name" required placeholder="Koné Mamadou">
      </label>
      <label>Téléphone
        <input name="phone" placeholder="+225 07 XX XX XX XX">
      </label>
      <label>Véhicule
        <input name="vehicle_id" placeholder="CAM-005">
      </label>
      <label>Type
        <select name="vehicle_type">
          <option value="porteur">Porteur</option>
          <option value="semi-remorque">Semi-remorque</option>
          <option value="citerne">Citerne</option>
          <option value="fourgon">Fourgon</option>
        </select>
      </label>
      <label>Couleur du marqueur
        <input name="marker_color" type="color" value="#1B6B3A">
      </label>
      <div class="modal-actions">
        <button type="button" id="driver-modal-cancel" class="btn btn-secondary">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
