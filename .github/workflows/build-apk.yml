name: Build Babyroad APK

# Compile l'app conducteur Android dans le cloud (aucun PC requis).
# L'APK est téléchargeable dans l'onglet Actions → run → Artifacts,
# et attaché à une Release "apk-latest".
on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-eik9gd]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Préparer la config (clé anon, safe côté client)
        run: cp src/config.example.js src/config.js

      - name: Installer les dépendances
        run: npm install

      - name: Bundler le web (src → www)
        run: npm run build

      - name: Générer la plateforme Android
        run: npx cap add android

      - name: Injecter les permissions GPS arrière-plan
        run: node patch-manifest.mjs

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK (debug, installable hors Play Store)
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk babyroad.apk

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: babyroad-apk
          path: android-app/babyroad.apk
          if-no-files-found: error

      - name: Publier en Release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Babyroad APK (dernière version)
          files: android-app/babyroad.apk
          body: |
            APK conducteur Babyroad — tracking GPS arrière-plan.
            Installer : autoriser "sources inconnues" puis ouvrir le fichier.
            À la 1ʳᵉ activation, accorder la localisation "Autoriser tout le temps".
