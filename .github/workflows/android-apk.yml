name: Build Android APK

# Builds the release APK, uploads it as an artifact, and (when the
# FIREBASE_SERVICE_ACCOUNT secret is set) auto-distributes it to testers via
# Firebase App Distribution for one-tap updates.

on:
  workflow_dispatch:
  push:
    branches: [claude/babyphone-dev-start-a4rsn9]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm install

      - name: Provide google-services.json
        run: |
          if [ ! -f android/app/google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing. Commit it to the repo (mobile/android/app/) or set the GOOGLE_SERVICES_JSON secret (base64)."
            exit 1
          fi

      - name: Generate debug keystore
        working-directory: mobile/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: babyphone-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Auto-distribute to testers (one-tap update via the Firebase App Tester
      # app). Skipped until the FIREBASE_SERVICE_ACCOUNT secret is set.
      - name: Distribute to testers (Firebase App Distribution)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:1006085209778:android:261bc60272ee41903f53ab
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: mobile/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Build auto depuis GitHub Actions"
